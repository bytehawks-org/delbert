[package]
name = "delbert-pki"
description = "Delbert internal PKI (CA, server and agent certificates, CSRs) and agent request proofs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nkeys.workspace = true
age.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
delbert-wire = { path = "../delbert-wire" }
ed25519-dalek.workspace = true
rand_core.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = "0.3"
x509-parser = "0.18"

[dev-dependencies]
oid-registry = "0.8"

[[bin]]
name = "delbert-pki"
path = "src/bin/delbert-pki.rs"
