[package]
name = "delbert-operator"
description = "Delbert Kubernetes Operator: delivers per-namespace configuration from the Core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
age.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
delbert-pki = { path = "../delbert-pki" }
futures.workspace = true
hmac = "0.12"
rand_core.workspace = true
reqwest.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4", default-features = false, features = ["derive", "client", "runtime", "rustls-tls", "ring"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
