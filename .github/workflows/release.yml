# Publishes a release when a tag `vX.Y.Z` is pushed (docs/install.md "Releases"):
#   - container images on ghcr.io (signed with cosign, with SBOM and provenance attestations)
#   - the Helm chart as an OCI artifact (oci://ghcr.io/<owner>/charts/delbert)
#   - deb/rpm packages and static binaries for amd64 and arm64, the Windows MSI and zip,
#     the install scripts, the single-host container bundle and SHA256SUMS on the GitHub release
# The tag must match the workspace version in Cargo.toml.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          [ "$version" = "$cargo_version" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    # One job for both architectures: they must be signed with the same key, and a key made
    # for the run (staging) cannot be handed from one job to another without exposing it.
    steps:
      - uses: actions/checkout@v4
      - name: Tools (zig as the cross linker, nfpm)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cargo-zigbuild ziglang
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      # The signing key: the repository secret PACKAGE_SIGNING_KEY (packaging/generate-signing-key.sh
      # makes one), with PACKAGE_SIGNING_PASSPHRASE if it has a passphrase. Without the secret the
      # release is signed with a key made for this run and named STAGING: the packages verify
      # against the public key published next to them, but nobody holds that key afterwards.
      - name: Signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/signing"
          if [ -n "$PACKAGE_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$PACKAGE_SIGNING_KEY" > "$RUNNER_TEMP/signing/delbert-signing-key.private.asc"
            umask 022
            # The public half comes from the private key itself, so the two cannot disagree.
            export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quiet --pinentry-mode loopback --passphrase "$NFPM_PASSPHRASE" --import "$RUNNER_TEMP/signing/delbert-signing-key.private.asc"
            gpg --batch --quiet --armor --export > "$RUNNER_TEMP/signing/delbert-signing-key.asc"
            gpg --show-keys "$RUNNER_TEMP/signing/delbert-signing-key.asc"
          else
            echo "::warning::PACKAGE_SIGNING_KEY is not set: this release is signed with a STAGING key"
            packaging/generate-signing-key.sh --name "Delbert packages" --email "${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com" --staging --out "$RUNNER_TEMP/signing"
          fi
      - name: Packages (amd64, arm64)
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            packaging/build-packages.sh "${{ needs.version.outputs.version }}" "$target" dist
          done
        env:
          # Shown in the package metadata: set the repository variable PACKAGE_MAINTAINER ("Name <address>").
          MAINTAINER: ${{ vars.PACKAGE_MAINTAINER }}
          SIGNING_KEY_FILE: ${{ runner.temp }}/signing/delbert-signing-key.private.asc
          NFPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
      - name: Install the amd64 packages (signatures verified), publish the public key
        run: |
          packaging/test-packages.sh dist docker "$RUNNER_TEMP/signing/delbert-signing-key.asc"
          cp "$RUNNER_TEMP/signing/delbert-signing-key.asc" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p delbert-agent
      - name: Smoke test
        shell: pwsh
        run: packaging/windows/smoke-test.ps1 -Agent target/release/delbert-agent.exe
      - name: MSI and zip
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          dotnet tool install --global wix --version 5.0.2
          wix build packaging/windows/delbert-agent.wxs -arch x64 -d Version=$version -d BinDir=target/release -o "dist/delbert-agent-$version-x64.msi"
          # The aliases are copies: the name of the executable chooses the commands.
          foreach ($alias in 'delbert', 'dg', 'overlook') { Copy-Item target/release/delbert-agent.exe "target/release/$alias.exe" }
          Compress-Archive -Path target/release/delbert-agent.exe, target/release/delbert.exe, target/release/dg.exe, target/release/overlook.exe, LICENSE -DestinationPath "dist/delbert-agent-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  images:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless signing (cosign) and attestations
    strategy:
      matrix:
        target: [core, agent, proxy, operator, tools, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/delbert-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.version.outputs.version }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"

  chart:
    needs: [version, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="${{ needs.version.outputs.version }}"
          helm package deploy/helm/delbert --version "$version" --app-version "$version" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/delbert-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [version, linux, windows, images, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install scripts, container bundle, checksums
        run: |
          version="${{ needs.version.outputs.version }}"
          cp packaging/install-agent.sh packaging/windows/install-agent.ps1 dist/
          # The single-host bundle installs the images of this release by default.
          mkdir -p bundle/delbert
          cp deploy/container/compose.yaml deploy/container/nats.conf deploy/container/postgres-init.sh deploy/container/install.sh bundle/delbert/
          sed -i "s/^DEFAULT_VERSION=.*/DEFAULT_VERSION=$version/" bundle/delbert/install.sh
          sed -i "s|ghcr.io/bytehawks-org|ghcr.io/${GITHUB_REPOSITORY_OWNER,,}|" bundle/delbert/install.sh
          tar -C bundle -czf "dist/delbert-container-$version.tar.gz" delbert
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Delbert ${{ needs.version.outputs.version }}" --generate-notes --verify-tag
