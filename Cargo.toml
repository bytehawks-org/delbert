[workspace]
resolver = "3"
members = ["crates/delbert-fs", "crates/delbert-policy", "crates/delbert-core", "crates/delbert-agent", "crates/delbert-wire", "crates/delbert-pki", "crates/delbert-natsauth", "crates/delbert-proxy"]

[workspace.lints.rust]
# No unsafe code anywhere; a crate that truly needs an FFI wrapper must opt out explicitly and say why.
unsafe_code = "forbid"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
age = "0.12"
argon2 = "0.5"
nkeys = "0.4"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
async-nats = "0.50"
futures = "0.3"
base64 = "0.22"
axum = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive", "env"] }
minijinja = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
utoipa = "5"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
