# Development NATS with mutual TLS and authorization callout (see docs/TESTING.md).
#  * Every client must present a certificate signed by the Delbert CA.
#  * Who may do what is decided by the Core (auth callout), per connection.
#  * Only the Core's callout service authenticates statically (user "auth").
# Values come from the environment: NATS_AUTH_PASSWORD, NATS_ISSUER_PUBLIC
# (the public key printed in dev/pki/nats-issuer.pub).
port: 4222
http: 8222

tls {
  cert_file: "/certs/nats.pem"
  key_file: "/certs/nats.key"
  ca_file: "/certs/ca.pem"
  verify: true
}

accounts {
  AUTH { users: [ { user: "auth", password: $NATS_AUTH_PASSWORD } ] }
  APP { jetstream: enabled }
}

jetstream { store_dir: "/data" }

authorization {
  auth_callout {
    issuer: $NATS_ISSUER_PUBLIC
    auth_users: [ auth ]
    account: AUTH
  }
}
