# Development NATS with mutual TLS: only clients holding a certificate signed by
# the Delbert CA can connect (see compose.e2e.yaml and docs/TESTING.md).
port: 4222
http: 8222
jetstream { store_dir: "/data" }
tls {
  cert_file: "/certs/nats.pem"
  key_file: "/certs/nats.key"
  ca_file: "/certs/ca.pem"
  verify: true
}
