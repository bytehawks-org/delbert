# NATS server of a branch office (see docs/TESTING.md). Same model as the Core's: mutual TLS with
# certificates of the Delbert CA, and an authorization callout, but the callout is served by the
# site's proxy with its own issuer key. The server certificate is the proxy's.
# Environment: NATS_AUTH_PASSWORD, NATS_ISSUER_PUBLIC (dev/proxy-identity/local-issuer.pub).
port: 4222
http: 8222

tls {
  cert_file: "/identity/cert.pem"
  key_file: "/identity/key.pem"
  ca_file: "/identity/ca.pem"
  verify: true
}

accounts {
  AUTH { users: [ { user: "auth", password: $NATS_AUTH_PASSWORD } ] }
  APP {}
}

authorization {
  auth_callout {
    issuer: $NATS_ISSUER_PUBLIC
    auth_users: [ auth ]
    account: AUTH
  }
}
