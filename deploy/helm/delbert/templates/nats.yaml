{{- $fullname := include "delbert.fullname" . -}}
{{- $selector := dict "ctx" . "component" "nats" -}}
# NATS with mutual TLS (certificates of the Delbert CA) and the authorization callout: the Core
# decides, per connection, what a client may do.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "delbert.labels" . | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http: 8222
    tls {
      cert_file: "/certs/nats.pem"
      key_file: "/certs/nats.key"
      ca_file: "/certs/ca.pem"
      verify: true
    }
    accounts {
      AUTH { users: [ { user: "auth", password: $NATS_AUTH_PASSWORD } ] }
      APP { jetstream: enabled }
    }
    jetstream { store_dir: "/data" }
    authorization {
      auth_callout {
        issuer: $NATS_ISSUER_PUBLIC
        auth_users: [ auth ]
        account: AUTH
      }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "delbert.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ $fullname }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "delbert.selector" $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delbert.selector" $selector | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: NATS_AUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "delbert.envSecret" . }}, key: NATS_AUTH_PASSWORD } }
            - name: NATS_ISSUER_PUBLIC
              valueFrom: { secretKeyRef: { name: {{ .Values.pki.existingSecret }}, key: nats-issuer.pub } }
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: monitor }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: monitor }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            {{- include "delbert.podSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: conf, mountPath: /etc/nats, readOnly: true }
            - { name: tls, mountPath: /certs, readOnly: true }
            - { name: data, mountPath: /data }
      volumes:
        - name: conf
          configMap: { name: {{ $fullname }}-nats }
        # Only what NATS needs out of the PKI secret.
        - name: tls
          secret:
            secretName: {{ .Values.pki.existingSecret }}
            defaultMode: 0440
            items:
              - { key: nats.pem, path: nats.pem }
              - { key: nats.key, path: nats.key }
              - { key: ca.pem, path: ca.pem }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.nats.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
---
# Agents reach NATS from outside the cluster (on K3s a LoadBalancer Service is served by the
# built-in ServiceLB on the node addresses).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "delbert.labels" . | nindent 4 }}
  {{- with .Values.nats.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.nats.service.type }}
  selector:
    {{- include "delbert.selector" $selector | nindent 4 }}
  ports:
    - { name: client, port: {{ .Values.nats.service.port }}, targetPort: client }
