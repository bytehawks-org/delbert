{{- /*
  Generated passwords. They are created by the first installation and kept on upgrades (the
  existing Secret is read back); `helm uninstall` leaves the Secret in place on purpose.
*/ -}}
{{- if not .Values.core.publicUrl }}{{ fail "core.publicUrl is required (how users and agents reach the Core)" }}{{ end }}
{{- if not .Values.nats.publicUrl }}{{ fail "nats.publicUrl is required (how agents reach NATS)" }}{{ end }}
{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) (or (not .Values.externalDatabase.url) (not .Values.externalDatabase.migrateUrl)) }}
{{- fail "with postgresql.enabled=false set externalDatabase.url and externalDatabase.migrateUrl, or externalDatabase.existingSecret" }}
{{- end }}
{{- $name := include "delbert.envSecret" . }}
{{- $old := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}{{ $old = .data }}{{ end }}
{{- $pgPassword := randAlphaNum 40 }}
{{- with get $old "POSTGRES_PASSWORD" }}{{ $pgPassword = b64dec . }}{{ end }}
{{- $rtPassword := randAlphaNum 40 }}
{{- with get $old "POSTGRES_RT_PASSWORD" }}{{ $rtPassword = b64dec . }}{{ end }}
{{- $natsPassword := randAlphaNum 40 }}
{{- with get $old "NATS_AUTH_PASSWORD" }}{{ $natsPassword = b64dec . }}{{ end }}
{{- /* 32 random bytes, base64url without padding. */ -}}
{{- $webSecret := randBytes 32 | replace "+" "-" | replace "/" "_" | trimSuffix "=" }}
{{- with get $old "WEB_SESSION_SECRET" }}{{ $webSecret = b64dec . }}{{ end }}
{{- $adminPassword := .Values.core.bootstrapAdminPassword | default (randAlphaNum 20) }}
{{- with get $old "DELBERT_BOOTSTRAP_ADMIN_PASSWORD" }}{{ $adminPassword = b64dec . }}{{ end }}
{{- $pgHost := printf "%s-postgresql" (include "delbert.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "delbert.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  NATS_AUTH_USER: auth
  NATS_AUTH_PASSWORD: {{ $natsPassword | quote }}
  WEB_SESSION_SECRET: {{ $webSecret | quote }}
  DELBERT_BOOTSTRAP_ADMIN_PASSWORD: {{ $adminPassword | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_RT_PASSWORD: {{ $rtPassword | quote }}
  DATABASE_URL: {{ printf "postgres://delbert_rt:%s@%s:5432/delbert" $rtPassword $pgHost | quote }}
  DATABASE_MIGRATE_URL: {{ printf "postgres://delbert:%s@%s:5432/delbert" $pgPassword $pgHost | quote }}
  {{- else if not .Values.externalDatabase.existingSecret }}
  DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  DATABASE_MIGRATE_URL: {{ .Values.externalDatabase.migrateUrl | quote }}
  {{- end }}
