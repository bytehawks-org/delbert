              secretName:
                description: Name of the generated `Secret` (default `delbert-secret`).
                nullable: true
                type: string
              tenant:
                description: Core tenant (slug) whose configuration is delivered.
                type: string
            required:
            - environment
            - tenant
            type: object
          status:
            description: Last delivery outcome, written by the reconcile loop.
            nullable: true
            properties:
              contentHash:
                description: Keyed content hash last applied (never a plain hash of secret values).
                nullable: true
                type: string
              message:
                description: Human-readable result of the last reconcile.
                nullable: true
                type: string
              observedVersion:
                description: Core bundle version last applied.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: DelbertBinding
        type: object
    served: true
    storage: true
    subresources:
      status: {}
