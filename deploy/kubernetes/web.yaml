# The administration UI (docs/FRONTEND.md). Secrets expected in the namespace (see docs/install.md):
#   delbert-web-env : WEB_SESSION_SECRET   (32 bytes, base64url)
#   delbert-pki     : ca.pem               (shared with the Core; only the CA certificate is mounted)
# Expose it over HTTPS with an Ingress (here the browser's TLS ends at the ingress, unlike the Core API).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delbert-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: delbert-web }
  template:
    metadata:
      labels: { app: delbert-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: delbert-web
          env:
            - { name: DELBERT_CORE_URL, value: "https://delbert-core:8443" }
            - { name: WEB_CORE_PUBLIC_URL, value: "https://delbert.example.com:8443" }   # CHANGE: how browsers reach the Core
            - { name: WEB_PUBLIC_URL, value: "https://ui.example.com" }                  # CHANGE: the UI's public address
            - { name: NODE_EXTRA_CA_CERTS, value: /pki/ca.pem }
          envFrom:
            - secretRef: { name: delbert-web-env }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: ca, mountPath: /pki, readOnly: true }
            - { name: cache, mountPath: /app/.next/cache }
      volumes:
        - name: ca
          secret:
            secretName: delbert-pki
            items: [{ key: ca.pem, path: ca.pem }]
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: delbert-web
spec:
  selector: { app: delbert-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Example Ingress (K3s ships Traefik); adapt the class and the TLS secret to your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delbert-web
spec:
  tls:
    - hosts: [ui.example.com]
      secretName: delbert-web-tls
  rules:
    - host: ui.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: delbert-web, port: { name: http } } } }
