# NATS for the single-host container install (compose.yaml): mutual TLS with the Delbert CA
# and the authorization callout answered by the Core. NATS_AUTH_PASSWORD comes from `.env`,
# NATS_ISSUER_PUBLIC from the keys volume (see the `nats` service).
port: 4222
http: 8222

tls {
  cert_file: "/keys/nats.pem"
  key_file: "/keys/nats.key"
  ca_file: "/keys/ca.pem"
  verify: true
}

accounts {
  AUTH { users: [ { user: "auth", password: $NATS_AUTH_PASSWORD } ] }
  APP { jetstream: enabled }
}

jetstream { store_dir: "/data" }

authorization {
  auth_callout {
    issuer: $NATS_ISSUER_PUBLIC
    auth_users: [ auth ]
    account: AUTH
  }
}
