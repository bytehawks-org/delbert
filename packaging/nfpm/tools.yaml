# nfpm definition of the delbert-tools package (deb and rpm). Built by
#   packaging/build-packages.sh <version> <rust target> [output directory]
# which fills in the four placeholders (VERSION, ARCH, BIN_DIR, MAINTAINER) before nfpm reads
# the file. The binaries are static (musl): one package serves every distribution of the architecture.
name: delbert-tools
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: ${MAINTAINER}
vendor: ByteHawks
homepage: https://github.com/bytehawks-org/delbert
license: Apache-2.0
description: |
  Delbert administration tools
  delbert-pki (internal CA, key bootstrap) and delbert-sign (policy signing keys).
contents:
  - src: ${BIN_DIR}/delbert-pki
    dst: /usr/bin/delbert-pki
    file_info: { mode: 0755 }
  - src: ${BIN_DIR}/delbert-sign
    dst: /usr/bin/delbert-sign
    file_info: { mode: 0755 }
